[platformio]
default_envs = m5stickc-plus-se-no-psram

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
extra_scripts =
    pre:tools/platformio_check_assets.py
build_flags =
    -DCORE_DEBUG_LEVEL=5
lib_deps =
    m5stack/M5GFX@0.2.26
    m5stack/M5Unified@0.2.19

; PlatformIO has no dedicated Plus SE manifest. The classic m5stick-c board
; definition supplies the required 4 MB flash layout, while M5GFX performs
; runtime hardware detection for the Plus, Plus 1.1, and Plus SE.
[env:m5stickc-plus-se-no-psram]
board = m5stick-c
board_build.flash_size = 4MB
board_upload.flash_size = 4MB

; Plus2 keeps PSRAM initialization enabled for hardware diagnostics and
; regression coverage only. The common RCA/rendering path explicitly uses
; internal RAM, so successful operation must not depend on this PSRAM.
[env:m5stickc-plus2-regression]
board = m5stick-c
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
